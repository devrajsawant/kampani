<section class="kc-jd" id="kcJobDetails">
  <div class="kc-jd-container">

    <a class="kc-jd-back" href="../index.html#careers">

          </span>
        </div>
      </div>

      <div class="kc-jd-grid">

        <!-- LEFT: JOB DESCRIPTION -->
        <article class="kc-jd-description">

          <div class="kc-jd-section">
            <div class="kc-jd-section-number">01</div>
            <h2>Who We're Looking For</h2>
            <div id="kcJdLookingFor"
                 class="kc-jd-description-text"></div>
          </div>

          <div class="kc-jd-section">
            <div class="kc-jd-section-number">02</div>
            <h2>What We Offer</h2>
            <div id="kcJdOffer"
                 class="kc-jd-description-text"></div>
          </div>

        </article>

        <!-- RIGHT: APPLICATION FORM -->
        <aside class="kc-jd-application">
          <div class="kc-jd-form-eyebrow">JOIN OUR TEAM</div>
          <h2>Apply for this role<span>.</span></h2>

          <p class="kc-jd-form-intro">
            Interested in this opportunity?
            Share your details and our team
            will review your application.
          </p>

          <form id="kcJdForm">

            <label for="kcJdName">
              Full Name <em>*</em>
            </label>
            <input id="kcJdName" type="text"
              placeholder="Your full name"
              maxlength="150" required>

            <label for="kcJdEmail">
              Email Address <em>*</em>
            </label>
            <input id="kcJdEmail" type="email"
              placeholder="you@example.com"
              maxlength="254" required>

            <label for="kcJdPhone">
              Phone Number <em>*</em>
            </label>
            <input id="kcJdPhone" type="tel"
              placeholder="+91 9876543210"
              maxlength="30" required>

            <label for="kcJdResume">
              Upload Resume <em>*</em>
            </label>
            <input id="kcJdResume" type="file"
              accept=".pdf,.doc,.docx" required>
            <small>
              PDF, DOC or DOCX — maximum 2 MB
            </small>

            <label for="kcJdMessage">
              Message
            </label>
            <textarea id="kcJdMessage"
              placeholder="Tell us a little about yourself..."
              maxlength="3000"
              rows="4"></textarea>

            <label class="kc-jd-consent">
              <input id="kcJdConsent"
                type="checkbox" required>
              <span>
                I agree to my information and resume
                being processed for recruitment purposes.
              </span>
            </label>

            <button type="submit" id="kcJdSubmit">
              <span id="kcJdSubmitText">
                Submit Application
              </span>
              <span class="kc-jd-arrow">↗</span>
            </button>

            <div id="kcJdFormStatus"
              class="kc-jd-form-status"
              role="status"
              aria-live="polite"></div>

          </form>
        </aside>

      </div>
    </div>
  </div>
